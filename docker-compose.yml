services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_wnt_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: pharmanet
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pharmanet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
